name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E (fast suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E fast suite
        run: npm run e2e
        env:
          # Fast suite only — cold-cache test is opt-in and not run in CI
          RUN_COLD_E2E: ""
          # Prevent Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: "1"
          # Mock env vars so the Next.js app starts without real Convex
          NEXT_PUBLIC_CONVEX_URL: "https://mock-convex.convex.cloud"
          MC_DEPLOY_TARGET: "cloud"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
