name: Publish Self-Hosted Images

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "apps/web/**"
      - "mcp-server/**"
      - "**/Dockerfile*"
      - "apps/web/.dockerignore"
      - "mcp-server/.dockerignore"

# Least-privilege: contents:read + packages:write + id-token:write (cosign keyless)
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Repository guard: fail fast if the workflow runs outside the
  # memorycrystal/ org. The cosign certificate-identity-regexp in
  # bootstrap.sh is: ^https://github\.com/memorycrystal/.+$
  # ──────────────────────────────────────────────────────────────
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository org
        run: |
          repo="${{ github.repository }}"
          event="${{ github.event_name }}"
          if [[ "$repo" != memorycrystal/* && "$event" != "pull_request" ]]; then
            echo "::error::This workflow must run in a memorycrystal/ repository for publish-capable events."
            echo "::error::Current repository: $repo"
            echo "::error::The cosign certificate-identity-regexp requires the workflow URL to match ^https://github\\.com/memorycrystal/.+$"
            exit 1
          fi
          echo "Repository guard passed for $event in $repo"

  build-and-push:
    needs: repo-guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mcp
            dockerfile: mcp-server/Dockerfile
            context: .
            size_limit_mb: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # Skip login on PRs (no push needed)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="pr-${{ github.event.pull_request.number }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Strip leading 'v' from the tag name
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            # workflow_dispatch on a branch: use short SHA
            VERSION="sha-$(echo '${{ github.sha }}' | head -c 8)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Compute image name
        id: image
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          echo "name=${IMG}" >> "$GITHUB_OUTPUT"

      - name: Determine whether to float :latest
        id: latest
        run: |
          # Float :latest only on stable semver tag push (no -rc / -beta / -alpha suffix)
          ref_name="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" != "pull_request" && \
                "${{ github.ref_type }}" == "tag" && \
                "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "float_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "float_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (tag / dispatch)
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.latest.outputs.float_latest == 'true' && format('{0}:latest', steps.image.outputs.name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Cosign keyless signing ──────────────────────────────
      # Requires id-token: write (set at job level above).
      # The signing certificate identity will be:
      #   https://github.com/memorycrystal/<repo>/.github/workflows/publish-selfhosted-images.yml@refs/tags/<tag>
      # which matches the bootstrap.sh regexp: ^https://github\.com/memorycrystal/.+$
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.4"

      - name: Sign image with cosign (keyless OIDC)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed: ${IMAGE}@${DIGEST}"

      # ── SBOM attestation ───────────────────────────────────
      - name: Generate SBOM with syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-release-assets: false

      - name: Attach SBOM as cosign attestation
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.image }}.spdx.json \
            --type spdx \
            "${IMAGE}@${DIGEST}"

      # ── Job summary ────────────────────────────────────────
      - name: Write job summary
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          REKOR_URL="https://search.sigstore.dev/?hash=${DIGEST}"
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## ${{ matrix.image }} image published

          | Field | Value |
          |-------|-------|
          | Image | \`${IMAGE}:${VERSION}\` |
          | Digest | \`${DIGEST}\` |
          | Platforms | \`linux/amd64\`, \`linux/arm64\` |
          | Sigstore Rekor entry | [View in Rekor search](${REKOR_URL}) |

          ### Verify locally
          \`\`\`bash
          cosign verify \\
            --certificate-identity-regexp '^https://github\\.com/memorycrystal/.+$' \\
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\
            ${IMAGE}@${DIGEST}
          \`\`\`
          SUMMARY
