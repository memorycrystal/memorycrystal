name: crystal-memory
version: "0.8.13"
description: Persistent Memory Crystal recall, capture, guardrails, and MCP tool parity for Hermes Agent
author: Memory Crystal
provides_memory_provider: true
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
provides_commands:
  - crystal_status
  - crystal_doctor
requires_env:
  - name: MEMORY_CRYSTAL_API_KEY
    description: Memory Crystal API key
    url: https://memorycrystal.ai/dashboard/settings
    secret: true
optional_env:
  - name: MEMORY_CRYSTAL_API_URL
    description: Memory Crystal backend base URL
    default: https://convex.memorycrystal.ai
  - name: CRYSTAL_CONVEX_URL
    description: Backwards-compatible backend base URL alias
    default: https://convex.memorycrystal.ai
  - name: MEMORY_CRYSTAL_HERMES_MODE
    description: "Hermes lifecycle mode: auto, provider, hooks, or disabled"
    default: auto
  - name: MEMORY_CRYSTAL_CAPTURE_TURNS
    description: Capture completed Hermes turns
    default: "true"
  - name: MEMORY_CRYSTAL_INJECT_RECALL
    description: Inject bounded recall context before model calls
    default: "true"
  - name: MEMORY_CRYSTAL_ALLOW_GROUP_WRITES
    description: Capture writes from group or public-chat contexts; set false to opt out
    default: "true"
  - name: MEMORY_CRYSTAL_AGENT_SCOPE
    description: Explicit agent/profile/workspace scope used in channel derivation
  - name: MEMORY_CRYSTAL_TIMEOUT
    description: General backend request timeout in seconds
    default: "8"
  - name: MEMORY_CRYSTAL_RECALL_TIMEOUT
    description: Wake and recall request timeout in seconds
    default: "10"
  - name: MEMORY_CRYSTAL_AUTO_RECALL_TIMEOUT
    description: Automatic pre-response wake and recall timeout in seconds
    default: "2.5"
  - name: MEMORY_CRYSTAL_CONTEXT_CHARS
    description: Maximum injected Memory Crystal context characters
    default: "6000"
  - name: MEMORY_CRYSTAL_FAILURE_THRESHOLD
    description: Consecutive backend failures before opening the circuit breaker
    default: "3"
  - name: MEMORY_CRYSTAL_CIRCUIT_COOLDOWN
    description: Circuit breaker cooldown in seconds
    default: "60"
  - name: MEMORY_CRYSTAL_PROVIDER_TOOLS
    description: "Provider bridge tool exposure: fallback, always, or disabled"
    default: fallback
  - name: MEMORY_CRYSTAL_MCP_CONFIGURED
    description: Override MCP detection for provider bridge fallback policy
  - name: MEMORY_CRYSTAL_CAPTURE_QUEUE_SIZE
    description: Maximum queued completed-turn captures
    default: "100"
  - name: MEMORY_CRYSTAL_CAPTURE_SHUTDOWN_FLUSH_TIMEOUT
    description: Provider shutdown capture queue flush budget in seconds
    default: "2"
